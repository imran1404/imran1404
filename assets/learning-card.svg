          stroke="#FF3347"
          stroke-width="2"/>

  <circle cx="430" cy="210" r="5" fill="#FF3347"/>
  <circle cx="490" cy="210" r="5" fill="#FF3347"/>
  <circle cx="460" cy="180" r="5" fill="#FF3347"/>
  <circle cx="460" cy="240" r="5" fill="#FF3347"/>


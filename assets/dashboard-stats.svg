<svg width="1200"
     height="130"
     viewBox="0 0 1200 130"
     xmlns="http://www.w3.org/2000/svg">

  <style>
    .pop {
      opacity: 0;
      animation: popIn 0.55s ease-out forwards;
    }

    .d1 { animation-delay: 0.2s; }
    .d2 { animation-delay: 0.5s; }
    .d3 { animation-delay: 0.8s; }
    .d4 { animation-delay: 1.1s; }
    .d5 { animation-delay: 1.4s; }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: translateY(14px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>

  <defs>
    <linearGradient id="bg"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#10141B"/>
    </linearGradient>
  </defs>


  <!-- BACKGROUND -->
  <rect x="1"
        y="1"
        width="1198"
        height="128"
        rx="14"
        fill="url(#bg)"
        stroke="#30363D"
        stroke-width="1.5"/>


  <!-- CARD 1 -->
  <g transform="translate(18,16)">
    <g class="pop d1">

      <rect width="220"
            height="98"
            rx="10"
            fill="#0D1117"
            stroke="#30363D"/>

      <text x="20"
            y="35"
            fill="#8B949E"
            font-family="Segoe UI, Arial"
            font-size="15">
        ▣  Repositories
      </text>

      <text id="repositories-value"
      x="20"
      y="72"
      fill="#FF3347"
      font-family="Segoe UI, Arial"
      font-size="27"
      font-weight="700">
  2
</text>

    </g>
  </g>


  <!-- CARD 2 -->
  <g transform="translate(254,16)">
    <g class="pop d2">

      <rect width="220"
            height="98"
            rx="10"
            fill="#0D1117"
            stroke="#30363D"/>

      <text x="20"
            y="35"
            fill="#8B949E"
            font-family="Segoe UI, Arial"
            font-size="15">
        ★  Stars Earned
      </text>

<text id="stars-value"
      x="20"
      y="72"
      fill="#FF3347"
      font-family="Segoe UI, Arial"
      font-size="27"
      font-weight="700">
  2
</text>

    </g>
  </g>


  <!-- CARD 3 -->
  <g transform="translate(490,16)">
    <g class="pop d3">

      <rect width="220"
            height="98"
            rx="10"
            fill="#0D1117"
            stroke="#30363D"/>

      <text x="20"
            y="35"
            fill="#8B949E"
            font-family="Segoe UI, Arial"
            font-size="15">
        ◉  Followers
      </text>

     <text id="followers-value"
      x="20"
      y="72"
      fill="#FF3347"
      font-family="Segoe UI, Arial"
      font-size="27"
      font-weight="700">
  3
</text>

    </g>
  </g>


  <!-- CARD 4 -->
  <g transform="translate(726,16)">
    <g class="pop d4">

      <rect width="220"
            height="98"
            rx="10"
            fill="#0D1117"
            stroke="#30363D"/>

      <text x="20"
            y="35"
            fill="#8B949E"
            font-family="Segoe UI, Arial"
            font-size="15">
        ⑂  Total Commits
      </text>

    <text id="commits-value"
      x="20"
      y="72"
      fill="#FF3347"
      font-family="Segoe UI, Arial"
      font-size="27"
      font-weight="700">
  —
</text>

    </g>
  </g>


  <!-- CARD 5 -->
  <g transform="translate(962,16)">
    <g class="pop d5">

      <rect width="220"
            height="98"
            rx="10"
            fill="#0D1117"
            stroke="#30363D"/>

      <text x="20"
            y="35"
            fill="#8B949E"
            font-family="Segoe UI, Arial"
            font-size="15">
        ⑂  PRs Merged
      </text>

     <text id="prs-value"
      x="20"
      y="72"
      fill="#FF3347"
      font-family="Segoe UI, Arial"
      font-size="27"
      font-weight="700">
  —
</text>

    </g>
  </g>


  <!-- BOTTOM ACCENT -->
  <rect x="20"
        y="124"
        width="1160"
        height="2"
        rx="1"
        fill="#FF3347"
        opacity="0.55"/>

</svg>

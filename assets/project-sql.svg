<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="440"
     viewBox="0 0 1200 440">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="70%" stop-color="#101720"/>
      <stop offset="100%" stop-color="#0A1118"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1F6FEB"/>
      <stop offset="100%" stop-color="#E63946"/>
    </linearGradient>
  </defs>

  <!-- Main Card -->
  <rect x="2" y="2"
        width="1196"
        height="436"
        rx="28"
        fill="url(#bg)"
        stroke="#30363D"
        stroke-width="2"/>

  <!-- Top Accent -->
  <rect x="0" y="0"
        width="1200"
        height="6"
        rx="3"
        fill="url(#accent)"/>

  <!-- Project Number -->
  <text x="60" y="70"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="18"
        font-weight="600"
        fill="#1F6FEB"
        letter-spacing="2">
    FEATURED PROJECT • 02
  </text>

  <!-- Project Title -->
  <text x="60" y="125"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="38"
        font-weight="700"
        fill="#F0F6FC">
    E-Commerce Sales Analysis — SQL
  </text>

  <!-- Subtitle -->
  <text x="60" y="165"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="21"
        fill="#8B949E">
    Relational Database Analytics Project
  </text>

  <!-- Divider -->
  <line x1="60" y1="195"
        x2="1140" y2="195"
        stroke="#21262D"
        stroke-width="2"/>

  <!-- Left Section -->
  <text x="60" y="240"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="17"
        font-weight="600"
        fill="#1F6FEB">
    SQL ANALYSIS
  </text>

  <text x="60" y="280"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="19"
        fill="#F0F6FC">
    ✓ JOIN-based relational analysis
  </text>

  <text x="60" y="315"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="19"
        fill="#F0F6FC">
    ✓ CTEs &amp; Subqueries
  </text>

  <text x="60" y="350"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="19"
        fill="#F0F6FC">
    ✓ Window Functions &amp; Ranking Analysis
  </text>

  <!-- Middle Divider -->
  <line x1="590" y1="225"
        x2="590" y2="370"
        stroke="#21262D"
        stroke-width="2"/>

  <!-- Right Section -->
  <text x="640" y="240"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="17"
        font-weight="600"
        fill="#E63946">
    TECH STACK
  </text>

  <!-- MySQL -->
  <rect x="640" y="265"
        width="125" height="48"
        rx="12"
        fill="#161B22"
        stroke="#30363D"/>

  <text x="702" y="296"
        text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="17"
        fill="#4479A1">
    MySQL
  </text>

  <!-- SQL -->
  <rect x="780" y="265"
        width="100" height="48"
        rx="12"
        fill="#161B22"
        stroke="#30363D"/>

  <text x="830" y="296"
        text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="17"
        fill="#F0F6FC">
    SQL
  </text>

  <!-- CTEs -->
  <rect x="895" y="265"
        width="100" height="48"
        rx="12"
        fill="#161B22"
        stroke="#30363D"/>

  <text x="945" y="296"
        text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="17"
        fill="#1F6FEB">
    CTEs
  </text>

  <!-- Window Functions -->
  <rect x="1010" y="265"
        width="150" height="48"
        rx="12"
        fill="#161B22"
        stroke="#30363D"/>

  <text x="1085" y="296"
        text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="16"
        fill="#E63946">
    Window Functions
  </text>

  <!-- Business Focus -->
  <text x="640" y="345"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="17"
        font-weight="600"
        fill="#8B949E">
    BUSINESS FOCUS
  </text>

  <text x="640" y="378"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="19"
        fill="#F0F6FC">
    Customer, product, order, and sales performance insights.
  </text>

  <!-- Bottom Accent -->
  <rect x="60" y="407"
        width="1080"
        height="3"
        rx="2"
        fill="url(#accent)"/>

</svg>

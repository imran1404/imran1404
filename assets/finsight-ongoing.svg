<svg width="1000" height="300"
     viewBox="0 0 1000 300"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#140A0D"/>
    </linearGradient>

    <!-- Red cinematic line -->
    <linearGradient id="redLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7A1F2B"/>
      <stop offset="50%" stop-color="#E63946"/>
      <stop offset="100%" stop-color="#7A1F2B"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip -->
    <clipPath id="clip">
      <rect x="4" y="4"
            width="992"
            height="292"
            rx="22"/>
    </clipPath>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND                                        -->
  <!-- ================================================= -->

  <rect x="4" y="4"
        width="992"
        height="292"
        rx="22"
        fill="url(#bg)"
        stroke="#30363D"
        stroke-width="1"/>


  <!-- ================================================= -->
  <!-- CINEMATIC TOP LINE                                -->
  <!-- ================================================= -->

  <rect x="55" y="28"
        width="890"
        height="2"
        fill="url(#redLine)"
        opacity="0">

    <animate attributeName="opacity"
             from="0"
             to="1"
             dur="0.8s"
             begin="0.1s"
             fill="freeze"/>

  </rect>


  <!-- ================================================= -->
  <!-- STATUS                                             -->
  <!-- ================================================= -->

  <g opacity="0">

    <circle cx="75"
            cy="68"
            r="6"
            fill="#2EA043"
            filter="url(#glow)"/>

    <text x="92"
          y="74"
          fill="#8B949E"
          font-family="Arial, Helvetica, sans-serif"
          font-size="16"
          letter-spacing="2">
      CURRENTLY BUILDING
    </text>

    <!-- Fade + entrance -->
    <animate attributeName="opacity"
             from="0"
             to="1"
             dur="0.7s"
             begin="0.2s"
             fill="freeze"/>

    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 20"
      to="0 0"
      dur="0.7s"
      begin="0.2s"
      fill="freeze"/>

  </g>


  <!-- ================================================= -->
  <!-- MAIN TITLE                                         -->
  <!-- ================================================= -->

  <g opacity="0">

    <text x="55"
          y="135"
          fill="#F0F6FC"
          font-family="Arial, Helvetica, sans-serif"
          font-size="46"
          font-weight="700">
      FINSIGHT
    </text>

    <animate attributeName="opacity"
             from="0"
             to="1"
             dur="0.8s"
             begin="0.45s"
             fill="freeze"/>

    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 30"
      to="0 0"
      dur="0.8s"
      begin="0.45s"
      fill="freeze"/>

  </g>


  <!-- ================================================= -->
  <!-- SUBTITLE                                           -->
  <!-- ================================================= -->

  <g opacity="0">

    <text x="55"
          y="168"
          fill="#E63946"
          font-family="Arial, Helvetica, sans-serif"
          font-size="18"
          font-weight="600"
          letter-spacing="1">
      FINANCIAL ANALYTICS PLATFORM
    </text>

    <animate attributeName="opacity"
             from="0"
             to="1"
             dur="0.7s"
             begin="0.7s"
             fill="freeze"/>

    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 20"
      to="0 0"
      dur="0.7s"
      begin="0.7s"
      fill="freeze"/>

  </g>


  <!-- ================================================= -->
  <!-- DESCRIPTION                                        -->
  <!-- ================================================= -->

  <g opacity="0">

    <text x="55"
          y="205"
          fill="#8B949E"
          font-family="Arial, Helvetica, sans-serif"
          font-size="15">
      Banking analytics • Customers • Loans • Cards • Transactions
    </text>

    <animate attributeName="opacity"
             from="0"
             to="1"
             dur="0.7s"
             begin="0.9s"
             fill="freeze"/>

    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 15"
      to="0 0"
      dur="0.7s"
      begin="0.9s"
      fill="freeze"/>

  </g>


  <!-- ================================================= -->
  <!-- TECHNOLOGY CHIPS                                  -->
  <!-- ================================================= -->

  <g opacity="0">

    <!-- SQL -->
    <rect x="55"
          y="230"
          width="65"
          height="30"
          rx="15"
          fill="#161B22"
          stroke="#30363D"/>

    <text x="87"
          y="250"
          text-anchor="middle"
          fill="#F0F6FC"
          font-family="Arial, Helvetica, sans-serif"
          font-size="12"
          font-weight="600">
      SQL
    </text>


    <!-- Python -->
    <rect x="130"
          y="230"
          width="80"
          height="30"
          rx="15"
          fill="#161B22"
          stroke="#30363D"/>

    <text x="170"
          y="250"
          text-anchor="middle"
          fill="#F0F6FC"
          font-family="Arial, Helvetica, sans-serif"
          font-size="12"
          font-weight="600">
      PYTHON
    </text>


    <!-- Power BI -->
    <rect x="220"
          y="230"
          width="90"
          height="30"
          rx="15"
          fill="#161B22"
          stroke="#30363D"/>

    <text x="265"
          y="250"
          text-anchor="middle"
          fill="#F0F6FC"
          font-family="Arial, Helvetica, sans-serif"
          font-size="12"
          font-weight="600">
      POWER BI
    </text>


    <animate attributeName="opacity"
             from="0"
             to="1"
             dur="0.7s"
             begin="1.1s"
             fill="freeze"/>

    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 15"
      to="0 0"
      dur="0.7s"
      begin="1.1s"
      fill="freeze"/>

  </g>


  <!-- ================================================= -->
  <!-- RIGHT PANEL                                        -->
  <!-- ================================================= -->

  <g opacity="0">

    <!-- Divider -->
    <line x1="670"
          y1="65"
          x2="670"
          y2="245"
          stroke="#30363D"/>


    <!-- Status label -->
    <text x="715"
          y="105"
          fill="#8B949E"
          font-family="Arial, Helvetica, sans-serif"
          font-size="13"
          letter-spacing="1">
      PROJECT STATUS
    </text>


    <!-- Development status -->
    <text x="715"
          y="140"
          fill="#E63946"
          font-family="Arial, Helvetica, sans-serif"
          font-size="24"
          font-weight="700">
      IN DEVELOPMENT
    </text>


    <!-- Description -->
    <text x="715"
          y="177"
          fill="#8B949E"
          font-family="Arial, Helvetica, sans-serif"
          font-size="14">
      Building analytics
    </text>

    <text x="715"
          y="198"
          fill="#8B949E"
          font-family="Arial, Helvetica, sans-serif"
          font-size="14">
      for financial decision-making
    </text>


    <!-- CTA -->
    <text x="715"
          y="238"
          fill="#F0F6FC"
          font-family="Arial, Helvetica, sans-serif"
          font-size="14"
          font-weight="600">
      → EXPLORE PROJECT
    </text>


    <!-- Right panel entrance -->
    <animate attributeName="opacity"
             from="0"
             to="1"
             dur="0.8s"
             begin="0.6s"
             fill="freeze"/>

    <animateTransform
      attributeName="transform"
      type="translate"
      from="30 0"
      to="0 0"
      dur="0.8s"
      begin="0.6s"
      fill="freeze"/>

  </g>


  <!-- ================================================= -->
  <!-- FINAL RED LINE                                     -->
  <!-- ================================================= -->

  <rect x="55"
        y="276"
        width="890"
        height="1"
        fill="#7A1F2B"
        opacity="0">

    <animate attributeName="opacity"
             from="0"
             to="0.7"
             dur="0.6s"
             begin="1.3s"
             fill="freeze"/>

  </rect>

</svg>

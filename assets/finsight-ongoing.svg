<svg width="1000" height="300" viewBox="0 0 1000 300"
     xmlns="http://www.w3.org/2000/svg">

<style>
  .finsight-pop {
    opacity: 0;
    transform: translateY(35px) scale(0.96);
    transform-origin: center;
    animation: finsightEnter 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  @keyframes finsightEnter {
    0% {
      opacity: 0;
      transform: translateY(35px) scale(0.96);
    }

    70% {
      opacity: 1;
      transform: translateY(-3px) scale(1.005);
    }

    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .delay1 {
    animation-delay: 0.15s;
  }

  .delay2 {
    animation-delay: 0.35s;
  }

  .delay3 {
    animation-delay: 0.55s;
  }

  .delay4 {
    animation-delay: 0.75s;
  }

  .delay5 {
    animation-delay: 0.95s;
  }
</style>
     
  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#140A0D"/>
    </linearGradient>

    <linearGradient id="redLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7A1F2B"/>
      <stop offset="50%" stop-color="#E63946"/>
      <stop offset="100%" stop-color="#7A1F2B"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background -->
  <rect x="4" y="4" width="992" height="292"
        rx="22"
        fill="url(#bg)"
        stroke="#30363D"/>

  <!-- Top cinematic line -->
  <rect x="55" y="28" width="890" height="2"
        fill="url(#redLine)"/>

  <!-- Status -->
  <circle cx="75" cy="68" r="6"
          fill="#2EA043"
          filter="url(#glow)"/>

  <text x="92" y="74"
        fill="#8B949E"
        font-family="Arial, Helvetica, sans-serif"
        font-size="16"
        letter-spacing="2">
    CURRENTLY BUILDING
  </text>

  <!-- Main title -->
  <text x="55" y="135"
        fill="#F0F6FC"
        font-family="Arial, Helvetica, sans-serif"
        font-size="46"
        font-weight="700">
    FINSIGHT
  </text>

  <text x="55" y="168"
        fill="#E63946"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18"
        font-weight="600"
        letter-spacing="1">
    FINANCIAL ANALYTICS PLATFORM
  </text>

  <!-- Description -->
  <text x="55" y="205"
        fill="#8B949E"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15">
    Banking analytics • Customers • Loans • Cards • Transactions
  </text>

  <!-- Technology chips -->
  <rect x="55" y="230" width="65" height="30" rx="15"
        fill="#161B22" stroke="#30363D"/>

  <text x="87" y="250"
        text-anchor="middle"
        fill="#F0F6FC"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12"
        font-weight="600">
    SQL
  </text>

  <rect x="130" y="230" width="80" height="30" rx="15"
        fill="#161B22" stroke="#30363D"/>

  <text x="170" y="250"
        text-anchor="middle"
        fill="#F0F6FC"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12"
        font-weight="600">
    PYTHON
  </text>

  <rect x="220" y="230" width="90" height="30" rx="15"
        fill="#161B22" stroke="#30363D"/>

  <text x="265" y="250"
        text-anchor="middle"
        fill="#F0F6FC"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12"
        font-weight="600">
    POWER BI
  </text>

  <!-- Right side -->
  <line x1="670" y1="65" x2="670" y2="245"
        stroke="#30363D"/>

  <text x="715" y="105"
        fill="#8B949E"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        letter-spacing="1">
    PROJECT STATUS
  </text>

  <text x="715" y="140"
        fill="#E63946"
        font-family="Arial, Helvetica, sans-serif"
        font-size="24"
        font-weight="700">
    IN DEVELOPMENT
  </text>

  <text x="715" y="177"
        fill="#8B949E"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
    Building analytics
  </text>

  <text x="715" y="198"
        fill="#8B949E"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
    for financial decision-making
  </text>

  <text x="715" y="238"
        fill="#F0F6FC"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14"
        font-weight="600">
    → EXPLORE PROJECT
  </text>

</svg>

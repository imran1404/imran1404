<svg width="1200" height="360" viewBox="0 0 1200 360"
     xmlns="http://www.w3.org/2000/svg">

<style>

  /* CARD ENTRANCE */
  .pop {
  opacity: 0;
  animation: popIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

.delay1 { animation-delay: 0.15s; }
.delay2 { animation-delay: 0.35s; }
.delay3 { animation-delay: 0.65s; }
.delay4 { animation-delay: 0.95s; }
.delay5 { animation-delay: 1.25s; }

  @keyframes popIn {
    0% {
      opacity: 0;
      transform: translateY(16px);
    }

    100% {
      opacity: 1;
      transform: translateY(0);
    }
  }


  /* LINE GRAPH DRAW ANIMATION */
  .chart-line {
    stroke-dasharray: 900;
    stroke-dashoffset: 900;
    animation: drawLine 2.3s ease-out 0.8s forwards;
  }

  @keyframes drawLine {
    to {
      stroke-dashoffset: 0;
    }
  }


  /* GRAPH POINTS */
  .point {
    opacity: 0;
    animation: pointIn 0.35s ease-out forwards;
  }

  .p1 { animation-delay: 1.0s; }
  .p2 { animation-delay: 1.15s; }
  .p3 { animation-delay: 1.30s; }
  .p4 { animation-delay: 1.45s; }
  .p5 { animation-delay: 1.60s; }
  .p6 { animation-delay: 1.75s; }
  .p7 { animation-delay: 1.90s; }
  .p8 { animation-delay: 2.05s; }
  .p9 { animation-delay: 2.20s; }
  .p10 { animation-delay: 2.35s; }
  .p11 { animation-delay: 2.50s; }
  .p12 { animation-delay: 2.65s; }

  @keyframes pointIn {
    0% {
      opacity: 0;
      r: 0;
    }

    100% {
      opacity: 1;
      r: 4;
    }
  }

</style>


<defs>

  <!-- BACKGROUND -->
  <linearGradient id="background"
                  x1="0" y1="0"
                  x2="1" y2="1">

    <stop offset="0%"
          stop-color="#080C10"/>

    <stop offset="55%"
          stop-color="#0D1117"/>

    <stop offset="100%"
          stop-color="#14090B"/>

  </linearGradient>


  <!-- RED GRAPH -->
  <linearGradient id="graphGradient"
                  x1="0" y1="0"
                  x2="1" y2="0">

    <stop offset="0%"
          stop-color="#B3131B"/>

    <stop offset="45%"
          stop-color="#FF343D"/>

    <stop offset="100%"
          stop-color="#FF6670"/>

  </linearGradient>


  <!-- GRAPH AREA -->
  <linearGradient id="areaGradient"
                  x1="0" y1="0"
                  x2="0" y2="1">

    <stop offset="0%"
          stop-color="#FF343D"
          stop-opacity=".18"/>

    <stop offset="100%"
          stop-color="#FF343D"
          stop-opacity="0"/>

  </linearGradient>


  <!-- GLOW -->
  <filter id="glow">

    <feGaussianBlur
      stdDeviation="4"
      result="blur"/>

    <feMerge>

      <feMergeNode in="blur"/>

      <feMergeNode in="SourceGraphic"/>

    </feMerge>

  </filter>

</defs>


<!-- ================================================= -->
<!-- BACKGROUND -->
<!-- ================================================= -->

<rect width="1200"
      height="360"
      rx="16"
      fill="url(#background)"
      stroke="#30363D"/>



name: Update Contribution Heatmap

on:
  workflow_dispatch:

  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: write

jobs:
  update-heatmap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch contribution data
        run: python scripts/fetch_contributions.py

      - name: Generate heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/contributions.json
          git add assets/contribution-heatmap.svg

          git diff --cached --quiet || git commit -m "Update contribution heatmap"

          git push
